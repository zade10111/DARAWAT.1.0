<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Buyers - DARAWAT Seller Dashboard</title>
    
    <link rel="stylesheet" href="Css/Seller Buyers.css">
    
</head>
<body>
    <!-- Desktop Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    🌿 DARAWAT
                </div>
                <nav class="main-nav">
                    <a href="Register as Seller.html" class="nav-link">
                        🏠 Dashboard
                    </a>
                    <a href="Seller Buyers.html" class="nav-link active">
                        👥 Buyers
                    </a>
                    <a href="Buyer Inquiries.html" class="nav-link">
                        � Inquiries
                    </a>
                    <a href="Seller Messages.html" class="nav-link">
                        💬 Messages
                    </a>
                    <a href="Seller Profile.html" class="nav-link">
                        👤 My Profile
                    </a>
                </nav>
                <div class="user-info">
                    <div id="welcomeMessage">Welcome, Farmer!</div>
                    <div class="user-avatar" id="userAvatar">F</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Header -->
    <div class="mobile-header">
        <div class="mobile-logo">🌿 DARAWAT</div>
        <div class="mobile-user-info">
            <div class="mobile-welcome" id="mobileWelcomeMessage">Welcome, User</div>
            <div class="mobile-avatar" id="mobileUserAvatar">F</div>
        </div>
    </div>

    <main class="dashboard">
        <div class="container">
            <section class="buyers-section">
                <div class="section-header">
                    <h2>📋 Buyer List</h2>
                    <div class="search-bar">
                        <input type="text" id="searchBuyers" placeholder="Search buyers...">
                        <button class="search-btn" id="searchBtn">
                            🔍 Search
                        </button>
                    </div>
                </div>

                <div class="buyers-filters">
                    <div class="filter-group">
                        <label>Filter by Status</label>
                        <select id="statusFilter">
                            <option value="all">All Buyers</option>
                            <option value="active">Active</option>
                            <option value="new">New</option>
                            <option value="returning">Returning</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Sort by</label>
                        <select id="sortBy">
                            <option value="recent">Most Recent</option>
                            <option value="name">Name</option>
                            <option value="orders">Most Orders</option>
                            <option value="spent">Total Spent</option>
                        </select>
                    </div>
                </div>

                <div class="buyers-list" id="buyersList">
                    <!-- Buyer cards will be dynamically generated by JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <!-- Mobile Navigation -->
    <div class="mobile-nav">
        <div class="mobile-nav-buttons">
            <a href="Register as Seller.html" class="mobile-nav-btn">
                <span class="mobile-nav-icon">🏠</span>
                <span>Dashboard</span>
            </a>
            <a href="Seller Buyers.html" class="mobile-nav-btn active">
                <span class="mobile-nav-icon">👥</span>
                <span>Buyers</span>
            </a>
             <a href="Buyer Inquiries.html" class="mobile-nav-btn">
                <span class="mobile-nav-icon">💬</span>
                <span>Inquiries</span>
            </a>
            <a href="Seller Messages.html" class="mobile-nav-btn">
                <span class="mobile-nav-icon">💬</span>
                <span>Messages</span>
            </a>
            <a href="Seller Profile.html" class="mobile-nav-btn">
                <span class="mobile-nav-icon">👤</span>
                <span>Profile</span>
            </a>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>🌿 DARAWAT &copy; 2026 - Connecting Farmers and Buyers</p>
        </div>
    </footer>

    <!-- Buyer Detail Modal -->
    <div id="buyerDetailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>👤 Buyer Details</h3>
                <span class="close">✕</span>
            </div>
            <div class="modal-body" id="buyerDetailBody">
                <!-- Content will be dynamically generated -->
            </div>
        </div>
    </div>

    <!-- Message Buyer Modal -->
    <div id="messageBuyerModal" class="modal message-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>💬 Message Buyer</h3>
                <span class="close">✕</span>
            </div>
            <div class="modal-body">
                <form class="message-form" id="messageForm">
                    <div class="form-group">
                        <label for="messageRecipient">To</label>
                        <input type="text" id="messageRecipient" readonly>
                    </div>
                    <div class="form-group">
                        <label for="messageSubject">Subject</label>
                        <input type="text" id="messageSubject" placeholder="Enter message subject">
                    </div>
                    <div class="form-group">
                        <label for="messageContent">Message</label>
                        <textarea id="messageContent" placeholder="Type your message here..."></textarea>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-secondary" id="cancelMessage">
                            ❌ Cancel
                        </button>
                        <button type="submit" class="btn-primary">
                            📤 Send Message
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        ✅
        <span></span>
    </div>

    <script>
        // Complete JavaScript for Seller Buyers Page with Avatar Support and Dark Theme

        document.addEventListener('DOMContentLoaded', function() {
            // Load theme preference
            loadThemePreference();
            
            // Check if user is logged in
            const currentUser = localStorage.getItem('currentUser');
            
            if (!currentUser) {
                // Redirect to login if not logged in
                window.location.href = 'Register as Seller.html';
                return;
            }
            
            const user = JSON.parse(currentUser);
            if (user.role !== 'seller') {
                // Redirect if not a seller
                window.location.href = 'Register as Seller.html';
                return;
            }
            
            // Update welcome message and avatar
            document.getElementById('welcomeMessage').textContent = `Welcome, ${user.farmName || user.name}!`;
            document.getElementById('mobileWelcomeMessage').textContent = `Welcome, ${user.farmName || user.name}!`;
            
            // Update avatar with profile picture if exists
            const userAvatar = document.getElementById('userAvatar');
            const mobileUserAvatar = document.getElementById('mobileUserAvatar');
            
            if (user.profilePicture) {
                userAvatar.innerHTML = `<img src="${user.profilePicture}" alt="Profile Picture">`;
                mobileUserAvatar.innerHTML = `<img src="${user.profilePicture}" alt="Profile Picture">`;
            } else {
                userAvatar.textContent = (user.farmName || user.name).charAt(0).toUpperCase();
                mobileUserAvatar.textContent = (user.farmName || user.name).charAt(0).toUpperCase();
            }
            
            // Initialize the page
            initializePage();
            
            // Listen for theme changes from other tabs
            window.addEventListener('storage', function(e) {
                if (e.key === 'farmnetTheme') {
                    loadThemePreference();
                }
            });
        });

        function loadThemePreference() {
            const theme = localStorage.getItem('farmnetTheme') || 'light';
            document.body.classList.toggle('dark-theme', theme === 'dark');
        }

        function initializePage() {
            // Load buyers data
            loadBuyers();
            
            // Set up event listeners
            setupEventListeners();
            
            // Set up real-time data sync
            setupRealTimeSync();
        }

        function setupEventListeners() {
            // Search functionality
            document.getElementById('searchBtn').addEventListener('click', handleSearch);
            document.getElementById('searchBuyers').addEventListener('keyup', handleAutoSearch);
            
            // Filter functionality
            document.getElementById('statusFilter').addEventListener('change', filterBuyers);
            document.getElementById('sortBy').addEventListener('change', sortBuyers);
            
            // Modal close buttons
            document.querySelectorAll('.close').forEach(closeBtn => {
                closeBtn.addEventListener('click', function() {
                    this.closest('.modal').style.display = 'none';
                    document.body.classList.remove('modal-open');
                });
            });
            
            // Close modals when clicking outside
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                        document.body.classList.remove('modal-open');
                    }
                });
            });
            
            // Message form submission
            document.getElementById('messageForm').addEventListener('submit', sendMessage);
            
            // Cancel message button
            document.getElementById('cancelMessage').addEventListener('click', function() {
                document.getElementById('messageBuyerModal').style.display = 'none';
                document.body.classList.remove('modal-open');
            });
        }

        function setupRealTimeSync() {
            // Listen for storage changes to update the buyers list
            window.addEventListener('storage', function(e) {
                if (e.key === 'farmConnectOrders' || e.key === 'farmConnectUsers') {
                    loadBuyers();
                }
            });
            
            // Custom event for localStorage changes
            window.addEventListener('localStorageChanged', function(e) {
                if (e.key === 'farmConnectOrders' || e.key === 'farmConnectUsers') {
                    loadBuyers();
                }
            });
        }

        function loadBuyers() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const allOrders = JSON.parse(localStorage.getItem('farmConnectOrders') || '[]');
            const allUsers = JSON.parse(localStorage.getItem('farmConnectUsers') || '[]');
            
            // Get orders for this seller
            const sellerOrders = allOrders.filter(order => order.sellerEmail === currentUser.email);
            
            // Extract unique buyers from orders
            const buyerEmails = [...new Set(sellerOrders.map(order => order.buyerEmail))];
            
            // Get buyer details
            const buyers = buyerEmails.map(email => {
                const buyer = allUsers.find(user => user.email === email && user.role === 'buyer');
                const buyerOrders = sellerOrders.filter(order => order.buyerEmail === email);
                
                // Calculate buyer stats
                const totalOrders = buyerOrders.length;
                const totalSpent = buyerOrders.reduce((sum, order) => {
                    const price = parseFloat(order.price) || 0;
                    const quantity = parseInt(order.quantity) || 0;
                    return sum + (price * quantity);
                }, 0);
                
                const firstOrderDate = buyerOrders.length > 0 ? 
                    new Date(Math.min(...buyerOrders.map(o => new Date(o.date)))) : null;
                
                const lastOrderDate = buyerOrders.length > 0 ? 
                    new Date(Math.max(...buyerOrders.map(o => new Date(o.date)))) : null;
                
                // Determine buyer status
                let status = 'new';
                if (totalOrders > 5) status = 'active';
                if (firstOrderDate && (new Date() - firstOrderDate) > (30 * 24 * 60 * 60 * 1000)) status = 'returning';
                
                // Get buyer avatar - check multiple sources
                let avatar = null;
                if (buyer) {
                    // Check for buyer-specific avatar first
                    const buyerAvatar = localStorage.getItem(`buyerAvatar_${buyer.email}`);
                    if (buyerAvatar) {
                        avatar = buyerAvatar;
                    } else if (buyer.profilePicture) {
                        avatar = buyer.profilePicture;
                    }
                }
                
                return {
                    email: email,
                    name: buyer ? buyer.name : 'Unknown Buyer',
                    address: buyer ? buyer.address : 'Address not available',
                    phone: buyer ? buyer.phone : 'Phone not available',
                    avatar: avatar,
                    totalOrders: totalOrders,
                    totalSpent: totalSpent,
                    firstOrderDate: firstOrderDate,
                    lastOrderDate: lastOrderDate,
                    status: status,
                    recentOrders: buyerOrders.slice(-3).reverse() // Last 3 orders
                };
            });
            
            // Store buyers data for filtering and sorting
            window.buyersData = buyers;
            
            // Display buyers
            displayBuyers(buyers);
        }

        function displayBuyers(buyers) {
            const buyersList = document.getElementById('buyersList');
            
            if (buyers.length === 0) {
                buyersList.innerHTML = `
                    <div class="empty-state">
                        <p>👥</p>
                        <p>No buyers yet. When customers purchase your products, they will appear here.</p>
                        <a href="Register as Seller.html" class="action-btn">➕ Add Products</a>
                    </div>
                `;
                return;
            }
            
            buyersList.innerHTML = '';
            
            buyers.forEach(buyer => {
                const buyerCard = document.createElement('div');
                buyerCard.className = 'buyer-card';
                
                // Get first letter for avatar fallback
                const firstLetter = buyer.name.charAt(0).toUpperCase();
                
                // Create avatar HTML - use image if available, otherwise use initial
                let avatarHTML = '';
                if (buyer.avatar) {
                    avatarHTML = `<img src="${buyer.avatar}" alt="${buyer.name}">`;
                } else {
                    avatarHTML = firstLetter;
                }
                
                buyerCard.innerHTML = `
                    <div class="buyer-header">
                        <div class="buyer-avatar">${avatarHTML}</div>
                        <div class="buyer-info">
                            <h3>${buyer.name}</h3>
                            <p>📧 ${buyer.email}</p>
                            <p>📍 ${buyer.address}</p>
                        </div>
                    </div>
                    <div class="buyer-details">
                        <div class="buyer-stats">
                            <div class="stat-item">
                                <div class="stat-value">${buyer.totalOrders}</div>
                                <div class="stat-label">Total Orders</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">₱${buyer.totalSpent.toFixed(2)}</div>
                                <div class="stat-label">Total Spent</div>
                            </div>
                        </div>
                        
                        <div class="recent-orders">
                            <h4>🛒 Recent Orders</h4>
                            ${buyer.recentOrders.length > 0 ? 
                                buyer.recentOrders.map(order => `
                                    <div class="order-item">
                                        <div>
                                            <div class="order-name">${order.productName}</div>
                                            <div class="order-date">${new Date(order.date).toLocaleDateString()}</div>
                                        </div>
                                        <div class="order-amount">₱${(parseFloat(order.price) * parseInt(order.quantity)).toFixed(2)}</div>
                                    </div>
                                `).join('') : 
                                '<p>No recent orders</p>'
                            }
                        </div>
                        
                        <div class="buyer-actions">
                            <button class="action-btn message-btn" data-email="${buyer.email}" data-name="${buyer.name}">
                                💬 Message
                            </button>
                            <button class="action-btn view-btn" data-email="${buyer.email}">
                                👁️ View Details
                            </button>
                        </div>
                    </div>
                `;
                
                buyersList.appendChild(buyerCard);
            });
            
            // Add event listeners to action buttons
            document.querySelectorAll('.message-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const email = this.getAttribute('data-email');
                    const name = this.getAttribute('data-name');
                    openMessageModal(email, name);
                });
            });
            
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const email = this.getAttribute('data-email');
                    openBuyerDetailModal(email);
                });
            });
        }

        function openMessageModal(email, name) {
            document.getElementById('messageRecipient').value = name;
            document.getElementById('messageBuyerModal').style.display = 'flex';
            document.body.classList.add('modal-open');
            
            // Store the buyer email for sending the message
            document.getElementById('messageBuyerModal').setAttribute('data-buyer-email', email);
        }

        function openBuyerDetailModal(email) {
            const buyer = window.buyersData.find(b => b.email === email);
            if (!buyer) return;
            
            const modalBody = document.getElementById('buyerDetailBody');
            
            // Get all orders for this buyer
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const allOrders = JSON.parse(localStorage.getItem('farmConnectOrders') || '[]');
            const buyerOrders = allOrders.filter(order => 
                order.sellerEmail === currentUser.email && order.buyerEmail === email
            );
            
            // Calculate additional stats
            const avgOrderValue = buyer.totalOrders > 0 ? buyer.totalSpent / buyer.totalOrders : 0;
            const daysSinceLastOrder = buyer.lastOrderDate ? 
                Math.floor((new Date() - new Date(buyer.lastOrderDate)) / (1000 * 60 * 60 * 24)) : 'N/A';
            
            // Create avatar HTML for detail modal
            let avatarHTML = '';
            if (buyer.avatar) {
                avatarHTML = `<img src="${buyer.avatar}" alt="${buyer.name}">`;
            } else {
                avatarHTML = buyer.name.charAt(0).toUpperCase();
            }
            
            modalBody.innerHTML = `
                <div class="buyer-detail-header">
                    <div class="buyer-detail-avatar">${avatarHTML}</div>
                    <div class="buyer-detail-info">
                        <h3>${buyer.name}</h3>
                        <p>📧 ${buyer.email}</p>
                        <p>📍 ${buyer.address}</p>
                        ${buyer.phone ? `<p>📞 ${buyer.phone}</p>` : ''}
                        <p>🛒 Customer since: ${buyer.firstOrderDate ? buyer.firstOrderDate.toLocaleDateString() : 'N/A'}</p>
                    </div>
                </div>
                
                <div class="buyer-detail-stats">
                    <div class="detail-stat">
                        <div class="detail-stat-value">${buyer.totalOrders}</div>
                        <div class="detail-stat-label">Total Orders</div>
                    </div>
                    <div class="detail-stat">
                        <div class="detail-stat-value">₱${buyer.totalSpent.toFixed(2)}</div>
                        <div class="detail-stat-label">Total Spent</div>
                    </div>
                    <div class="detail-stat">
                        <div class="detail-stat-value">₱${avgOrderValue.toFixed(2)}</div>
                        <div class="detail-stat-label">Avg Order Value</div>
                    </div>
                    <div class="detail-stat">
                        <div class="detail-stat-value">${daysSinceLastOrder}</div>
                        <div class="detail-stat-label">Days Since Last Order</div>
                    </div>
                </div>
                
                <div class="orders-table-container">
                    <h4>📋 Order History</h4>
                    ${buyerOrders.length > 0 ? `
                        <table class="orders-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Product</th>
                                    <th>Date</th>
                                    <th>Quantity</th>
                                    <th>Price</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${buyerOrders.map(order => `
                                    <tr>
                                        <td>#${order.id}</td>
                                        <td>${order.productName}</td>
                                        <td>${new Date(order.date).toLocaleDateString()}</td>
                                        <td>${order.quantity}</td>
                                        <td>₱${parseFloat(order.price).toFixed(2)}</td>
                                        <td>₱${(parseFloat(order.price) * parseInt(order.quantity)).toFixed(2)}</td>
                                        <td>
                                            <span class="order-status ${order.status === 'completed' ? 'status-completed' : 
                                                order.status === 'pending' ? 'status-pending' : 'status-cancelled'}">
                                                ${order.status || 'completed'}
                                            </span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    ` : '<p>No order history available.</p>'}
                </div>
                
                <div class="modal-actions">
                    <button class="btn-secondary" id="closeDetailModal">
                        ❌ Close
                    </button>
                    <button class="btn-primary" id="messageFromDetail" data-email="${buyer.email}" data-name="${buyer.name}">
                        💬 Message Buyer
                    </button>
                </div>
            `;
            
            // Add event listeners for modal buttons
            document.getElementById('closeDetailModal').addEventListener('click', function() {
                document.getElementById('buyerDetailModal').style.display = 'none';
                document.body.classList.remove('modal-open');
            });
            
            document.getElementById('messageFromDetail').addEventListener('click', function() {
                const email = this.getAttribute('data-email');
                const name = this.getAttribute('data-name');
                document.getElementById('buyerDetailModal').style.display = 'none';
                openMessageModal(email, name);
            });
            
            document.getElementById('buyerDetailModal').style.display = 'flex';
            document.body.classList.add('modal-open');
        }

        function sendMessage(e) {
            e.preventDefault();
            
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const buyerEmail = document.getElementById('messageBuyerModal').getAttribute('data-buyer-email');
            const subject = document.getElementById('messageSubject').value;
            const content = document.getElementById('messageContent').value;
            
            if (!subject || !content) {
                showToast('Please fill in all fields.', 'error');
                return;
            }
            
            // Create message object
            const message = {
                id: Date.now(),
                sellerEmail: currentUser.email,
                sellerName: currentUser.farmName || currentUser.name,
                buyerEmail: buyerEmail,
                subject: subject,
                content: content,
                date: new Date().toISOString(),
                read: false,
                direction: 'seller_to_buyer'
            };
            
            // Save message to localStorage
            const messages = JSON.parse(localStorage.getItem('farmConnectMessages') || '[]');
            messages.push(message);
            localStorage.setItem('farmConnectMessages', JSON.stringify(messages));
            
            // Close modal and reset form
            document.getElementById('messageBuyerModal').style.display = 'none';
            document.body.classList.remove('modal-open');
            document.getElementById('messageForm').reset();
            
            showToast('Message sent successfully!');
            
            // Trigger storage event to update other pages
            window.dispatchEvent(new Event('storage'));
        }

        function handleSearch() {
            const searchTerm = document.getElementById('searchBuyers').value.trim().toLowerCase();
            filterAndSortBuyers(searchTerm);
        }

        function handleAutoSearch() {
            const searchTerm = document.getElementById('searchBuyers').value.trim().toLowerCase();
            
            clearTimeout(window.searchTimeout);
            window.searchTimeout = setTimeout(() => {
                filterAndSortBuyers(searchTerm);
            }, 300);
        }

        function filterBuyers() {
            filterAndSortBuyers();
        }

        function sortBuyers() {
            filterAndSortBuyers();
        }

        function filterAndSortBuyers(searchTerm = '') {
            if (!window.buyersData) return;
            
            let filteredBuyers = [...window.buyersData];
            
            // Apply search filter
            if (searchTerm) {
                filteredBuyers = filteredBuyers.filter(buyer => 
                    buyer.name.toLowerCase().includes(searchTerm) ||
                    buyer.email.toLowerCase().includes(searchTerm) ||
                    buyer.address.toLowerCase().includes(searchTerm)
                );
            }
            
            // Apply status filter
            const statusFilter = document.getElementById('statusFilter').value;
            if (statusFilter !== 'all') {
                filteredBuyers = filteredBuyers.filter(buyer => buyer.status === statusFilter);
            }
            
            // Apply sorting
            const sortBy = document.getElementById('sortBy').value;
            switch(sortBy) {
                case 'name':
                    filteredBuyers.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'orders':
                    filteredBuyers.sort((a, b) => b.totalOrders - a.totalOrders);
                    break;
                case 'spent':
                    filteredBuyers.sort((a, b) => b.totalSpent - a.totalSpent);
                    break;
                case 'recent':
                default:
                    filteredBuyers.sort((a, b) => new Date(b.lastOrderDate) - new Date(a.lastOrderDate));
                    break;
            }
            
            // Display filtered and sorted buyers
            displayBuyers(filteredBuyers);
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastText = toast.querySelector('span');
            
            toastText.textContent = message;
            toast.className = 'toast';
            
            if (type === 'error') {
                toast.classList.add('error');
                toast.innerHTML = '❌<span></span>';
                toast.querySelector('span').textContent = message;
            } else {
                toast.innerHTML = '✅<span></span>';
                toast.querySelector('span').textContent = message;
            }
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
