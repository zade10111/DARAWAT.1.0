<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - DARAWAT Seller</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="Css/Seller Messages.css">
    
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-leaf"></i> DARAWAT
                </div>
                <nav class="main-nav">
                    <a href="Register as Seller.html" class="nav-link">
                        <i class="fas fa-shopping-cart"></i> Dashboard
                    </a>
                </nav>
                <div class="user-info">
                    <span id="welcomeMessage">Seller!</span>
                    <div class="user-avatar" id="userAvatar">S</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Messages Page Content -->
    <main class="messages-page">
        <div class="container">
            <button class="mobile-sidebar-toggle" id="mobileSidebarToggle">
                <i class="fas fa-bars"></i> Show Chats
            </button>
            
            <section class="messages-container">
                <!-- Chats Sidebar -->
                <div class="chats-sidebar" id="chatsSidebar">
                    <div class="chats-header">
                        <button class="close-sidebar" id="closeSidebar">
                            <i class="fas fa-times"></i> Close
                        </button>
                        <h2><i class="fas fa-comments"></i> Your Chats</h2>
                    </div>
                    <div class="chats-search">
                        <div class="search-container">
                            <i class="fas fa-search search-icon"></i>
                            <input type="text" id="chatsSearch" placeholder="Search chats...">
                        </div>
                    </div>
                    <div class="chats-list" id="chatsList" role="list" aria-label="List of conversations">
                        <!-- Chat items will be dynamically generated -->
                    </div>
                </div>

                <!-- Chat Content Area -->
                <div class="chat-content">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <div class="chat-header-avatar" id="chatHeaderAvatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="chat-header-info">
                                <h2 id="chatTitle">Select a chat</h2>
                                <p id="chatSubtitle">Choose a conversation from the list</p>
                            </div>
                        </div>
                        <div class="chat-actions" id="chatActions" style="display: none;">
                            <button class="chat-action-btn" id="viewProductBtn">
                                <i class="fas fa-tag"></i> View Product
                            </button>
                            <button class="chat-action-btn" id="viewBuyerBtn">
                                <i class="fas fa-user"></i> View Buyer
                            </button>
                            <button class="delete-chat-btn" id="deleteChatBtn">
                                <i class="fas fa-trash"></i> Delete Chat
                            </button>
                        </div>
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <div class="no-chat-selected">
                            <div class="icon"><i class="fas fa-comments"></i></div>
                            <h3>No chat selected</h3>
                            <p>Select a conversation from the list to start messaging</p>
                        </div>
                    </div>

                    <div class="chat-input-container" id="chatInputContainer" style="display: none;">
                        <div class="chat-input-wrapper">
                            <textarea class="chat-input" id="chatInput" placeholder="Type your message..." rows="1"></textarea>
                        </div>
                        <button class="media-upload-btn" id="mediaUploadBtn" title="Attach image or video">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <input type="file" id="mediaFileInput" accept="image/*,video/*" multiple>
                        <button class="send-chat-btn" id="sendChatBtn" disabled>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                        <div id="mediaPreviewContainer" class="media-preview-container" style="display: none;">
                            <img id="mediaPreview" class="media-preview" src="" alt="Preview">
                            <span class="media-preview-filename" id="mediaPreviewFilename">file.jpg</span>
                            <button class="media-preview-remove" id="mediaPreviewRemove">
                                <i class="fas fa-times"></i>
                            </button>
                            <div class="upload-progress" id="uploadProgressContainer" style="display: none;">
                                <div class="upload-progress-bar" id="uploadProgressBar" style="width: 0%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Confirmation Modal -->
    <div class="modal-overlay" id="confirmationModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Confirm Deletion</h3>
                <p class="modal-message" id="modalMessage">Are you sure you want to delete this?</p>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">Cancel</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="notification-toast" id="notificationToast"></div>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <div class="mobile-nav-items">
            <a href="Register as Seller.html" class="mobile-nav-item">
                <div class="mobile-nav-icon"><i class="fas fa-shopping-cart"></i></div>
                <div class="mobile-nav-label">Dashboard</div>
            </a>
            <a href="Seller Messages.html" class="mobile-nav-item active">
                <div class="mobile-nav-icon"><i class="fas fa-comments"></i></div>
                <div class="mobile-nav-label">Messages</div>
            </a>
        </div>
    </nav>

    <script>
        // Message Status Constants
        const MessageStatus = {
            SENDING: 'sending',
            SENT: 'sent',
            DELIVERED: 'delivered',
            READ: 'read',
            FAILED: 'failed'
        };

        // Message Types
        const MessageType = {
            TEXT: 'text',
            IMAGE: 'image',
            VIDEO: 'video'
        };

        // DOM Elements
        const welcomeMessage = document.getElementById('welcomeMessage');
        const userAvatar = document.getElementById('userAvatar');
        const chatsList = document.getElementById('chatsList');
        const chatTitle = document.getElementById('chatTitle');
        const chatSubtitle = document.getElementById('chatSubtitle');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');
        const chatInputContainer = document.getElementById('chatInputContainer');
        const chatActions = document.getElementById('chatActions');
        const viewProductBtn = document.getElementById('viewProductBtn');
        const viewBuyerBtn = document.getElementById('viewBuyerBtn');
        const chatsSearch = document.getElementById('chatsSearch');
        const deleteChatBtn = document.getElementById('deleteChatBtn');
        const confirmationModal = document.getElementById('confirmationModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        const notificationToast = document.getElementById('notificationToast');
        const mobileSidebarToggle = document.getElementById('mobileSidebarToggle');
        const chatsSidebar = document.getElementById('chatsSidebar');
        const closeSidebar = document.getElementById('closeSidebar');
        const chatHeaderAvatar = document.getElementById('chatHeaderAvatar');
        const mediaUploadBtn = document.getElementById('mediaUploadBtn');
        const mediaFileInput = document.getElementById('mediaFileInput');
        const mediaPreviewContainer = document.getElementById('mediaPreviewContainer');
        const mediaPreview = document.getElementById('mediaPreview');
        const mediaPreviewFilename = document.getElementById('mediaPreviewFilename');
        const mediaPreviewRemove = document.getElementById('mediaPreviewRemove');
        const uploadProgressContainer = document.getElementById('uploadProgressContainer');
        const uploadProgressBar = document.getElementById('uploadProgressBar');

        // Current chat state
        let currentChatId = null;
        let currentProduct = null;
        let currentBuyer = null;
        let searchTimeout = null;
        let isTyping = false;
        let pendingDeletion = {
            type: null,
            id: null
        };
        let retryAttempts = new Map();
        let webSocket = null;
        let pendingMediaFiles = [];

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            loadThemePreference();
            initializeStorage();
            initializeEventListeners();
            checkExistingLogin();
            loadChats();
            updateUnreadMessagesCount();
            setupRealTimeSync();
            setupServiceWorker();
            
            // Listen for theme changes from other tabs
            window.addEventListener('storage', function(e) {
                if (e.key === 'farmnetTheme') {
                    loadThemePreference();
                }
            });
        });

        function loadThemePreference() {
            const theme = localStorage.getItem('farmnetTheme') || 'light';
            document.body.classList.toggle('dark-theme', theme === 'dark');
        }

        // Setup service worker for offline functionality
        function setupServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            }
        }

        // Setup real-time data synchronization
        function setupRealTimeSync() {
            try {
                webSocket = new WebSocket('ws://localhost:8080/messages');
                
                webSocket.onopen = function() {
                    console.log('WebSocket connection established');
                };
                
                webSocket.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    handleRealTimeUpdate(data);
                };
                
                webSocket.onclose = function() {
                    console.log('WebSocket connection closed');
                };
                
                webSocket.onerror = function(error) {
                    console.error('WebSocket error:', error);
                };
            } catch (error) {
                console.log('WebSocket not available');
            }

            // Local storage synchronization
            window.addEventListener('storage', function(e) {
                if (e.key === 'farmConnectChats') {
                    updateUnreadMessagesCount();
                    loadChats();
                    if (currentChatId) {
                        loadChatMessages(currentChatId);
                    }
                }
            });
        }

        // Handle real-time updates
        function handleRealTimeUpdate(data) {
            switch(data.type) {
                case 'new_message':
                    if (data.chatId === currentChatId) {
                        addNewMessage(data.message);
                    }
                    updateUnreadMessagesCount();
                    loadChats();
                    break;
                    
                case 'typing':
                    if (data.chatId === currentChatId && data.sender !== 'seller') {
                        showTypingIndicator(data.senderName);
                    }
                    break;
                    
                case 'message_read':
                    if (data.chatId === currentChatId) {
                        updateMessageStatus(data.messageId, MessageStatus.READ);
                    }
                    break;
            }
        }

        // Safe storage operations with error handling
        function safeStorageGet(key, defaultValue = []) {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : defaultValue;
            } catch (error) {
                console.error(`Error reading ${key} from storage:`, error);
                showNotification('Error loading data', 'error');
                return defaultValue;
            }
        }

        function safeStorageSet(key, value) {
            try {
                const valueStr = JSON.stringify(value);
                if (valueStr.length > 5000000) {
                    console.warn('Data too large for localStorage, truncating');
                    if (key === 'farmConnectChats' && Array.isArray(value)) {
                        value.forEach(chat => {
                            if (chat.messages && chat.messages.length > 50) {
                                chat.messages = chat.messages.slice(-50);
                            }
                        });
                    }
                }
                localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch (error) {
                console.error(`Error writing ${key} to storage:`, error);
                showNotification('Error saving data', 'error');
                return false;
            }
        }

        // Get current user helper function
        function getCurrentUser() {
            return safeStorageGet('currentUser', null);
        }

        // Initialize storage with sample data
        function initializeStorage() {
            if (!localStorage.getItem('farmConnectChats')) {
                const sampleChats = [
                    {
                        id: 1,
                        buyerEmail: "buyer@example.com",
                        sellerEmail: "seller@example.com",
                        buyerName: "John Buyer",
                        sellerName: "Green Valley Farms",
                        productId: 101,
                        productName: "Organic Tomatoes",
                        lastMessageTime: new Date().toISOString(),
                        messages: [
                            {
                                id: 1,
                                text: "Hi, I'm interested in your organic tomatoes. Do you have any available this week?",
                                sender: "buyer",
                                senderEmail: "buyer@example.com",
                                timestamp: new Date(Date.now() - 86400000).toISOString(),
                                read: true,
                                status: MessageStatus.READ,
                                type: MessageType.TEXT
                            },
                            {
                                id: 2,
                                text: "Yes, we have a fresh batch available for pickup tomorrow!",
                                sender: "seller",
                                senderEmail: "seller@example.com",
                                timestamp: new Date(Date.now() - 43200000).toISOString(),
                                read: true,
                                type: MessageType.TEXT
                            }
                        ]
                    },
                    {
                        id: 2,
                        buyerEmail: "buyer2@example.com",
                        sellerEmail: "seller@example.com",
                        buyerName: "Sarah Customer",
                        sellerName: "Green Valley Farms",
                        productId: 102,
                        productName: "Free Range Eggs",
                        lastMessageTime: new Date(Date.now() - 3600000).toISOString(),
                        messages: [
                            {
                                id: 1,
                                text: "Are your eggs truly free range?",
                                sender: "buyer",
                                senderEmail: "buyer2@example.com",
                                timestamp: new Date(Date.now() - 7200000).toISOString(),
                                read: true,
                                status: MessageStatus.READ,
                                type: MessageType.TEXT
                            },
                            {
                                id: 2,
                                text: "Absolutely! Our chickens roam freely in our pastures.",
                                sender: "seller",
                                senderEmail: "seller@example.com",
                                timestamp: new Date(Date.now() - 3600000).toISOString(),
                                read: true,
                                type: MessageType.TEXT
                            }
                        ]
                    }
                ];
                safeStorageSet('farmConnectChats', sampleChats);
            }
            
            if (!localStorage.getItem('currentUser')) {
                safeStorageSet('currentUser', {
                    name: "Seller User",
                    email: "seller@example.com",
                    farmName: "Green Valley Farms"
                });
            }
            
            if (!localStorage.getItem('farmConnectUsers')) {
                const sampleUsers = [
                    {
                        name: "John Buyer",
                        email: "buyer@example.com",
                        role: "buyer",
                        isOnline: true
                    },
                    {
                        name: "Sarah Customer",
                        email: "buyer2@example.com",
                        role: "buyer",
                        isOnline: false
                    },
                    {
                        name: "Green Valley Farms",
                        email: "seller@example.com",
                        role: "seller",
                        isOnline: true
                    }
                ];
                safeStorageSet('farmConnectUsers', sampleUsers);
            }
        }

        // Set up event listeners
        function initializeEventListeners() {
            sendChatBtn.addEventListener('click', sendChatMessage);
            chatInput.addEventListener('input', handleChatInput);
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendChatMessage();
                }
            });
            
            chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
            
            chatsSearch.addEventListener('input', handleChatSearch);
            viewProductBtn.addEventListener('click', viewProduct);
            viewBuyerBtn.addEventListener('click', viewBuyer);
            deleteChatBtn.addEventListener('click', confirmDeleteChat);
            
            modalCancelBtn.addEventListener('click', closeModal);
            modalConfirmBtn.addEventListener('click', confirmDeletion);
            confirmationModal.addEventListener('click', function(e) {
                if (e.target === confirmationModal) {
                    closeModal();
                }
            });

            mobileSidebarToggle.addEventListener('click', function() {
                chatsSidebar.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
            
            closeSidebar.addEventListener('click', function() {
                chatsSidebar.classList.remove('active');
                document.body.style.overflow = '';
            });

            chatsSidebar.addEventListener('click', function(e) {
                if (e.target === chatsSidebar && window.innerWidth <= 768) {
                    chatsSidebar.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && window.innerWidth <= 768 && chatsSidebar.classList.contains('active')) {
                    chatsSidebar.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });

            // Media upload functionality
            mediaUploadBtn.addEventListener('click', function() {
                mediaFileInput.click();
            });

            mediaFileInput.addEventListener('change', handleMediaFileSelect);
            mediaPreviewRemove.addEventListener('click', clearPendingMedia);

            window.addEventListener('online', handleOnlineStatus);
            window.addEventListener('offline', handleOfflineStatus);
            document.addEventListener('visibilitychange', handleVisibilityChange);
        }

        // Handle media file selection
        function handleMediaFileSelect(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            pendingMediaFiles = Array.from(files);
            showMediaPreview(pendingMediaFiles[0]);
            updateSendButtonState();
            mediaFileInput.value = '';
        }

        // Show media preview
        function showMediaPreview(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                mediaPreview.src = event.target.result;
                mediaPreviewFilename.textContent = file.name;
                mediaPreviewContainer.style.display = 'flex';
                uploadProgressContainer.style.display = 'none';
                uploadProgressBar.style.width = '0%';
            };
            reader.readAsDataURL(file);
        }

        // Clear pending media
        function clearPendingMedia() {
            pendingMediaFiles = [];
            mediaPreviewContainer.style.display = 'none';
            mediaPreview.src = '';
            mediaPreviewFilename.textContent = '';
            updateSendButtonState();
        }

        // Update send button state
        function updateSendButtonState() {
            const hasText = chatInput.value.trim().length > 0;
            const hasMedia = pendingMediaFiles.length > 0;
            sendChatBtn.disabled = !(hasText || hasMedia);
        }

        // Handle chat input changes
        function handleChatInput() {
            updateSendButtonState();
            if (chatInput.value.trim() && currentChatId) {
                sendTypingIndicator();
            }
        }

        function handleOnlineStatus() {
            showNotification('You are back online', 'success');
            retryFailedMessages();
        }

        function handleOfflineStatus() {
            showNotification('You are offline. Some features may not work.', 'warning');
        }

        function handleVisibilityChange() {
            if (!document.hidden && currentChatId) {
                markMessagesAsRead(currentChatId);
            }
        }

        function retryFailedMessages() {
            const chats = safeStorageGet('farmConnectChats', []);
            let needsUpdate = false;

            chats.forEach(chat => {
                chat.messages.forEach(message => {
                    if (message.status === MessageStatus.FAILED) {
                        const attempts = retryAttempts.get(message.id) || 0;
                        if (attempts < 3) {
                            message.status = MessageStatus.SENDING;
                            retryAttempts.set(message.id, attempts + 1);
                            needsUpdate = true;
                            simulateMessageSending(chat.id, message.id);
                        }
                    }
                });
            });

            if (needsUpdate) {
                safeStorageSet('farmConnectChats', chats);
                if (currentChatId) {
                    loadChatMessages(currentChatId);
                }
            }
        }

        function sendTypingIndicator() {
            if (webSocket && webSocket.readyState === WebSocket.OPEN) {
                webSocket.send(JSON.stringify({
                    type: 'typing',
                    chatId: currentChatId,
                    sender: 'seller',
                    senderName: getCurrentUser().farmName || getCurrentUser().name
                }));
            }
        }

        function showTypingIndicator(senderName) {
            if (isTyping) return;
            
            isTyping = true;
            const typingElement = document.createElement('div');
            typingElement.className = 'typing-indicator';
            typingElement.innerHTML = `
                <span>${senderName} is typing</span>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatMessages.appendChild(typingElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            setTimeout(() => {
                if (typingElement.parentNode) {
                    typingElement.remove();
                }
                isTyping = false;
            }, 3000);
        }

        function checkExistingLogin() {
            const currentUser = getCurrentUser();
            if (currentUser) {
                showDashboard(currentUser.farmName || currentUser.name);
            } else {
                window.location.href = 'Seller Dashboard.html';
            }
        }

        function showDashboard(userName) {
            welcomeMessage.textContent = `${userName}!`;
            updateUserAvatar();
        }

        function updateUserAvatar() {
            const currentUser = getCurrentUser();
            if (currentUser) {
                userAvatar.textContent = (currentUser.farmName || currentUser.name).charAt(0).toUpperCase();
                const userAvatarImg = localStorage.getItem(`sellerAvatar_${currentUser.email}`);
                if (userAvatarImg) {
                    userAvatar.innerHTML = `<img src="${userAvatarImg}" alt="${currentUser.farmName || currentUser.name}">`;
                } else if (currentUser.profilePicture) {
                    userAvatar.innerHTML = `<img src="${currentUser.profilePicture}" alt="${currentUser.farmName || currentUser.name}">`;
                }
            }
        }

        function loadChats() {
            const currentUser = getCurrentUser();
            if (!currentUser) return;

            const chats = safeStorageGet('farmConnectChats', []);
            const sellerChats = chats.filter(chat => chat.sellerEmail === currentUser.email);

            chatsList.innerHTML = '';
            
            if (sellerChats.length === 0) {
                chatsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-comments"></i></div>
                        <h3>No conversations yet</h3>
                        <p>Buyers will appear here when they message you about your products</p>
                    </div>
                `;
            } else {
                sellerChats.sort((a, b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime)).forEach(chat => {
                    const unreadMessages = chat.messages.filter(msg => !msg.read && msg.sender === 'buyer');
                    const lastMessage = chat.messages[chat.messages.length - 1];
                    
                    const users = safeStorageGet('farmConnectUsers', []);
                    const buyer = users.find(u => u.email === chat.buyerEmail);
                    
                    const chatElement = document.createElement('div');
                    chatElement.className = `chat-item ${unreadMessages.length > 0 ? 'unread' : ''}`;
                    chatElement.setAttribute('data-chat-id', chat.id);
                    chatElement.setAttribute('role', 'listitem');
                    chatElement.setAttribute('tabindex', '0');
                    chatElement.innerHTML = `
                        <div class="chat-avatar">
                            ${getBuyerAvatar(chat.buyerEmail, chat.buyerName || 'Buyer')}
                            <div class="online-indicator ${buyer && buyer.isOnline ? '' : 'offline'}"></div>
                        </div>
                        <div class="chat-info">
                            <div class="chat-header-info">
                                <div class="chat-buyer">
                                    ${chat.buyerName || 'Buyer'}
                                    ${unreadMessages.length > 0 ? `<span class="unread-badge">${unreadMessages.length}</span>` : ''}
                                </div>
                                <div class="chat-date">${formatDetailedDate(chat.lastMessageTime)}</div>
                            </div>
                            <div class="chat-product">About: ${chat.productName}</div>
                            <div class="chat-preview">${getMessagePreview(lastMessage)}</div>
                        </div>
                    `;
                    chatsList.appendChild(chatElement);
                    
                    chatElement.addEventListener('click', function() {
                        openChat(chat.id);
                        if (window.innerWidth <= 768) {
                            chatsSidebar.classList.remove('active');
                            document.body.style.overflow = '';
                        }
                    });

                    chatElement.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            openChat(chat.id);
                            if (window.innerWidth <= 768) {
                                chatsSidebar.classList.remove('active');
                                document.body.style.overflow = '';
                            }
                        }
                    });
                });
            }
        }

        function getMessagePreview(message) {
            if (!message) return '';
            if (message.type === MessageType.IMAGE) return '📷 Image';
            if (message.type === MessageType.VIDEO) return '🎬 Video';
            return message.text || '';
        }

        function getBuyerAvatar(buyerEmail, buyerName) {
            const users = safeStorageGet('farmConnectUsers', []);
            const buyer = users.find(u => u.email === buyerEmail);
            
            if (buyer) {
                const buyerAvatarImg = localStorage.getItem(`buyerAvatar_${buyerEmail}`);
                if (buyerAvatarImg) {
                    return `<img src="${buyerAvatarImg}" alt="${buyerName}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
                } else if (buyer.profilePicture) {
                    return `<img src="${buyer.profilePicture}" alt="${buyerName}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
                } else {
                    return buyerName.charAt(0).toUpperCase();
                }
            } else {
                return buyerName.charAt(0).toUpperCase();
            }
        }

        function formatDetailedDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            
            if (diffMs < 60000) return 'Just now';
            if (diffMs < 3600000) return `${Math.floor(diffMs / 60000)} min ago`;
            if (diffMs < 86400000) return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function openChat(chatId) {
            currentChatId = chatId;
            
            const chats = safeStorageGet('farmConnectChats', []);
            const chat = chats.find(c => c.id === chatId);
            
            if (!chat) return;
            
            let hasUnread = false;
            chat.messages.forEach(msg => {
                if (!msg.read && msg.sender === 'buyer') {
                    msg.read = true;
                    hasUnread = true;
                }
            });
            
            if (hasUnread) {
                chat.lastMessageTime = new Date().toISOString();
                safeStorageSet('farmConnectChats', chats);
                updateUnreadMessagesCount();
                loadChats();
            }
            
            currentProduct = {
                name: chat.productName,
                id: chat.productId
            };
            
            const users = safeStorageGet('farmConnectUsers', []);
            currentBuyer = users.find(u => u.email === chat.buyerEmail) || {
                name: chat.buyerName || 'Buyer',
                email: chat.buyerEmail
            };
            
            chatTitle.textContent = currentBuyer.name;
            chatSubtitle.textContent = `About: ${chat.productName}`;
            chatHeaderAvatar.innerHTML = getBuyerAvatar(chat.buyerEmail, currentBuyer.name);
            
            chatActions.style.display = 'flex';
            chatInputContainer.style.display = 'flex';
            
            loadChatMessages(chatId);
            
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`.chat-item[data-chat-id="${chatId}"]`).classList.add('active');
            
            chatInput.focus();
            updateSendButtonState();
            markMessagesAsRead(chatId);
            clearPendingMedia();
        }

        function markMessagesAsRead(chatId) {
            const chats = safeStorageGet('farmConnectChats', []);
            const chat = chats.find(c => c.id === chatId);
            
            if (chat) {
                let updated = false;
                chat.messages.forEach(msg => {
                    if (!msg.read && msg.sender === 'buyer') {
                        msg.read = true;
                        updated = true;
                    }
                });
                
                if (updated) {
                    safeStorageSet('farmConnectChats', chats);
                    updateUnreadMessagesCount();
                    loadChats();
                }
            }
        }

        function loadChatMessages(chatId) {
            const chats = safeStorageGet('farmConnectChats', []);
            const chat = chats.find(c => c.id === chatId);
            
            if (!chat) return;
            
            chatMessages.innerHTML = '';
            
            if (chat.messages.length === 0) {
                chatMessages.innerHTML = `
                    <div class="no-chat-selected" style="height: 100%;">
                        <div class="icon"><i class="fas fa-comments"></i></div>
                        <h3>No messages yet</h3>
                        <p>Start the conversation!</p>
                    </div>
                `;
                return;
            }
            
            chat.messages.forEach(message => {
                addMessageToChat(message, chat);
            });
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addMessageToChat(message, chat) {
            const messageElement = document.createElement('div');
            const isSellerMessage = message.sender === 'seller';
            messageElement.className = `message-bubble ${isSellerMessage ? 'sent' : 'received'}`;
            messageElement.setAttribute('data-message-id', message.id);
            
            let avatarContent = '';
            if (isSellerMessage) {
                const currentUser = getCurrentUser();
                avatarContent = `<div class="message-avatar">${getSellerAvatar(currentUser)}</div>`;
            } else {
                avatarContent = `<div class="message-avatar">${getBuyerAvatar(message.senderEmail, chat.buyerName || 'Buyer')}</div>`;
            }
            
            let mediaContent = '';
            if (message.type === MessageType.IMAGE && message.mediaData) {
                mediaContent = `<img src="${message.mediaData}" class="media-preview-inline" alt="Image" onclick="viewFullMedia('${message.mediaData}', 'image')">`;
            } else if (message.type === MessageType.VIDEO && message.mediaData) {
                mediaContent = `<video src="${message.mediaData}" class="media-preview-inline video" controls onclick="event.stopPropagation()"></video>`;
            }
            
            messageElement.innerHTML = `
                ${avatarContent}
                <div class="message-content">
                    ${!isSellerMessage ? `<div class="message-sender">${chat.buyerName || 'Buyer'}</div>` : ''}
                    ${message.text ? `<div class="message-text">${sanitizeMessage(message.text)}</div>` : ''}
                    ${mediaContent}
                    <div class="message-time">${new Date(message.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    ${isSellerMessage ? `
                        <div class="message-status ${message.status || 'sent'}">
                            ${getStatusIcon(message.status)}
                            ${getStatusText(message.status)}
                        </div>
                    ` : ''}
                </div>
                ${isSellerMessage ? `
                    <div class="message-actions">
                        <button class="message-action-btn delete-message-btn" data-message-id="${message.id}" title="Delete message">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                ` : ''}
            `;
            chatMessages.appendChild(messageElement);
            
            if (isSellerMessage) {
                const deleteBtn = messageElement.querySelector('.delete-message-btn');
                deleteBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    confirmDeleteMessage(message.id);
                });
            }
        }

        function addNewMessage(message) {
            const chats = safeStorageGet('farmConnectChats', []);
            const chat = chats.find(c => c.id === currentChatId);
            
            if (chat) {
                chat.messages.push(message);
                chat.lastMessageTime = new Date().toISOString();
                safeStorageSet('farmConnectChats', chats);
                addMessageToChat(message, chat);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                if (message.sender !== 'seller') {
                    showNotification(`New message from ${chat.buyerName || 'Buyer'}`, 'info');
                }
            }
        }

        function getSellerAvatar(seller) {
            if (seller) {
                const sellerAvatarImg = localStorage.getItem(`sellerAvatar_${seller.email}`);
                if (sellerAvatarImg) {
                    return `<img src="${sellerAvatarImg}" alt="${seller.farmName || seller.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
                } else if (seller.profilePicture) {
                    return `<img src="${seller.profilePicture}" alt="${seller.farmName || seller.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
                } else {
                    return (seller.farmName || seller.name).charAt(0).toUpperCase();
                }
            } else {
                return 'S';
            }
        }

        function getStatusIcon(status) {
            switch(status) {
                case MessageStatus.SENDING: return '<i class="fas fa-clock"></i>';
                case MessageStatus.SENT: return '<i class="fas fa-check"></i>';
                case MessageStatus.DELIVERED: return '<i class="fas fa-check-double"></i>';
                case MessageStatus.READ: return '<i class="fas fa-check-double" style="color: var(--primary-light);"></i>';
                case MessageStatus.FAILED: return '<i class="fas fa-exclamation-circle"></i>';
                default: return '<i class="fas fa-check"></i>';
            }
        }

        function getStatusText(status) {
            switch(status) {
                case MessageStatus.SENDING: return 'Sending...';
                case MessageStatus.SENT: return 'Sent';
                case MessageStatus.DELIVERED: return 'Delivered';
                case MessageStatus.READ: return 'Read';
                case MessageStatus.FAILED: return 'Failed';
                default: return 'Sent';
            }
        }

        function sanitizeMessage(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendChatMessage() {
            const messageText = chatInput.value.trim();
            const hasText = messageText.length > 0;
            const hasMedia = pendingMediaFiles.length > 0;
            
            if (!hasText && !hasMedia) return;
            if (!currentChatId) return;
            
            try {
                await sendMessageWithMedia(messageText);
            } catch (error) {
                console.error('Failed to send message:', error);
                showNotification('Failed to send message', 'error');
            }
        }

        async function sendMessageWithMedia(text, maxRetries = 3) {
            const chats = safeStorageGet('farmConnectChats', []);
            const chatIndex = chats.findIndex(c => c.id === currentChatId);
            
            if (chatIndex === -1) throw new Error('Chat not found');
            
            const currentUser = getCurrentUser();
            const newMessage = {
                id: Date.now(),
                text: text || '',
                sender: 'seller',
                senderEmail: currentUser.email,
                timestamp: new Date().toISOString(),
                read: false,
                status: MessageStatus.SENDING,
                type: MessageType.TEXT
            };

            if (pendingMediaFiles.length > 0) {
                const mediaFile = pendingMediaFiles[0];
                const mediaType = mediaFile.type.startsWith('video/') ? MessageType.VIDEO : MessageType.IMAGE;
                newMessage.type = mediaType;
                
                try {
                    const mediaData = await readFileAsBase64(mediaFile);
                    newMessage.mediaData = mediaData;
                    newMessage.mediaName = mediaFile.name;
                    newMessage.mediaSize = mediaFile.size;
                } catch (error) {
                    console.error('Failed to process media:', error);
                    showNotification('Failed to process media file', 'error');
                    return;
                }
            }
            
            chats[chatIndex].messages.push(newMessage);
            chats[chatIndex].lastMessageTime = new Date().toISOString();
            
            const saveSuccess = safeStorageSet('farmConnectChats', chats);
            
            if (!saveSuccess) {
                newMessage.status = MessageStatus.FAILED;
                showNotification('Failed to save message. Please try again.', 'error');
                return;
            }
            
            chatInput.value = '';
            chatInput.style.height = 'auto';
            clearPendingMedia();
            updateSendButtonState();
            
            loadChatMessages(currentChatId);
            loadChats();
            
            let attempts = 0;
            while (attempts < maxRetries) {
                try {
                    if (webSocket && webSocket.readyState === WebSocket.OPEN) {
                        webSocket.send(JSON.stringify({
                            type: 'new_message',
                            chatId: currentChatId,
                            message: newMessage
                        }));
                    }
                    break;
                } catch (error) {
                    attempts++;
                    if (attempts === maxRetries) {
                        updateMessageStatus(currentChatId, newMessage.id, MessageStatus.FAILED);
                        retryAttempts.set(newMessage.id, 1);
                        throw error;
                    }
                    await new Promise(resolve => setTimeout(resolve, 1000 * attempts));
                }
            }
            
            simulateMessageSending(currentChatId, newMessage.id);
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    resolve(event.target.result);
                };
                reader.onerror = function(error) {
                    reject(error);
                };
                reader.readAsDataURL(file);
            });
        }

        function simulateMessageSending(chatId, messageId) {
            setTimeout(() => {
                updateMessageStatus(chatId, messageId, MessageStatus.SENT);
            }, 1000);
            
            setTimeout(() => {
                updateMessageStatus(chatId, messageId, MessageStatus.DELIVERED);
            }, 2000);
            
            setTimeout(() => {
                updateMessageStatus(chatId, messageId, MessageStatus.READ);
            }, 5000);
        }

        function updateMessageStatus(chatId, messageId, status) {
            const chats = safeStorageGet('farmConnectChats', []);
            const chatIndex = chats.findIndex(c => c.id === chatId);
            
            if (chatIndex === -1) return;
            
            const messageIndex = chats[chatIndex].messages.findIndex(m => m.id === messageId);
            if (messageIndex === -1) return;
            
            chats[chatIndex].messages[messageIndex].status = status;
            safeStorageSet('farmConnectChats', chats);
            
            if (currentChatId === chatId) {
                loadChatMessages(chatId);
            }
            
            loadChats();
        }

        function handleChatSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const searchTerm = chatsSearch.value.trim().toLowerCase();
                const chatItems = document.querySelectorAll('.chat-item');
                
                chatItems.forEach(item => {
                    const buyerName = item.querySelector('.chat-buyer').textContent.toLowerCase();
                    const productName = item.querySelector('.chat-product').textContent.toLowerCase();
                    const preview = item.querySelector('.chat-preview').textContent.toLowerCase();
                    
                    if (buyerName.includes(searchTerm) || productName.includes(searchTerm) || preview.includes(searchTerm)) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }, 300);
        }

        function viewProduct() {
            if (!currentProduct) return;
            sessionStorage.setItem('viewedProduct', JSON.stringify(currentProduct));
            window.location.href = 'Product Details.html';
        }

        function viewBuyer() {
            if (!currentBuyer) return;
            sessionStorage.setItem('viewedBuyer', JSON.stringify(currentBuyer));
            window.location.href = 'Buyer Profile.html';
        }

        function updateUnreadMessagesCount() {
            const currentUser = getCurrentUser();
            if (!currentUser) return;

            const chats = safeStorageGet('farmConnectChats', []);
            const sellerChats = chats.filter(chat => chat.sellerEmail === currentUser.email);

            let unreadCount = 0;
            sellerChats.forEach(chat => {
                const unreadMessages = chat.messages.filter(msg => !msg.read && msg.sender === 'buyer');
                unreadCount += unreadMessages.length;
            });

            if (unreadCount > 0) {
                document.title = `(${unreadCount}) Messages - FarmNet Seller`;
            } else {
                document.title = 'Messages - FarmNet Seller';
            }
        }

        function showNotification(message, type = 'info') {
            notificationToast.textContent = message;
            notificationToast.className = `notification-toast show ${type}`;
            
            setTimeout(() => {
                notificationToast.classList.remove('show');
            }, 3000);
        }

        function viewFullMedia(mediaData, type) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.9);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                cursor: pointer;
                padding: 20px;
            `;
            
            const content = type === 'image' 
                ? `<img src="${mediaData}" style="max-width: 90%; max-height: 90%; object-fit: contain;">`
                : `<video src="${mediaData}" style="max-width: 90%; max-height: 90%;" controls autoplay onclick="event.stopPropagation()"></video>`;
            
            modal.innerHTML = `
                ${content}
                <button style="position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; background: none; border: none; cursor: pointer; z-index: 10000;">&times;</button>
            `;
            
            modal.addEventListener('click', function(e) {
                if (e.target === modal || e.target.tagName === 'BUTTON') {
                    document.body.removeChild(modal);
                }
            });
            
            document.body.appendChild(modal);
        }

        function confirmDeleteMessage(messageId) {
            pendingDeletion = {
                type: 'message',
                id: messageId
            };
            
            modalTitle.textContent = 'Delete Message';
            modalMessage.textContent = 'Are you sure you want to delete this message? This action cannot be undone.';
            confirmationModal.classList.add('active');
        }

        function confirmDeleteChat() {
            if (!currentChatId) return;
            
            pendingDeletion = {
                type: 'chat',
                id: currentChatId
            };
            
            modalTitle.textContent = 'Delete Chat';
            modalMessage.textContent = 'Are you sure you want to delete this entire conversation? All messages will be permanently removed.';
            confirmationModal.classList.add('active');
        }

        function closeModal() {
            confirmationModal.classList.remove('active');
            pendingDeletion = {
                type: null,
                id: null
            };
        }

        function confirmDeletion() {
            if (pendingDeletion.type === 'message') {
                deleteMessage(pendingDeletion.id);
            } else if (pendingDeletion.type === 'chat') {
                deleteChat(pendingDeletion.id);
            }
            closeModal();
        }

        function deleteMessage(messageId) {
            const chats = safeStorageGet('farmConnectChats', []);
            const chatIndex = chats.findIndex(c => c.id === currentChatId);
            
            if (chatIndex === -1) return;
            
            const messageIndex = chats[chatIndex].messages.findIndex(m => m.id === messageId);
            if (messageIndex === -1) return;
            
            chats[chatIndex].messages.splice(messageIndex, 1);
            
            if (chats[chatIndex].messages.length > 0) {
                const lastMessage = chats[chatIndex].messages[chats[chatIndex].messages.length - 1];
                chats[chatIndex].lastMessageTime = lastMessage.timestamp;
            } else {
                chats[chatIndex].lastMessageTime = new Date().toISOString();
            }
            
            safeStorageSet('farmConnectChats', chats);
            loadChatMessages(currentChatId);
            loadChats();
            showNotification('Message deleted', 'success');
        }

        function deleteChat(chatId) {
            const chats = safeStorageGet('farmConnectChats', []);
            const chatIndex = chats.findIndex(c => c.id === chatId);
            
            if (chatIndex === -1) return;
            
            chats.splice(chatIndex, 1);
            safeStorageSet('farmConnectChats', chats);
            
            currentChatId = null;
            currentProduct = null;
            currentBuyer = null;
            
            chatTitle.textContent = 'Select a chat';
            chatSubtitle.textContent = 'Choose a conversation from the list';
            chatActions.style.display = 'none';
            chatInputContainer.style.display = 'none';
            chatMessages.innerHTML = `
                <div class="no-chat-selected">
                    <div class="icon"><i class="fas fa-comments"></i></div>
                    <h3>No chat selected</h3>
                    <p>Select a conversation from the list to start messaging</p>
                </div>
            `;
            
            loadChats();
            showNotification('Chat deleted', 'success');
        }

        function searchMessages(keyword) {
            const results = [];
            const chats = safeStorageGet('farmConnectChats', []);
            const currentUser = getCurrentUser();
            
            chats.forEach(chat => {
                if (chat.sellerEmail === currentUser.email) {
                    const matchingMessages = chat.messages.filter(message => 
                        message.text && message.text.toLowerCase().includes(keyword.toLowerCase())
                    );
                    
                    if (matchingMessages.length > 0) {
                        results.push({
                            chatId: chat.id,
                            chatName: chat.buyerName || 'Buyer',
                            productName: chat.productName,
                            messages: matchingMessages
                        });
                    }
                }
            });
            
            return results;
        }

        function exportChat(chatId) {
            const chats = safeStorageGet('farmConnectChats', []);
            const chat = chats.find(c => c.id === chatId);
            
            if (!chat) return;
            
            const chatData = {
                buyer: chat.buyerName || 'Buyer',
                product: chat.productName,
                messages: chat.messages.map(msg => ({
                    sender: msg.sender === 'seller' ? 'You' : chat.buyerName || 'Buyer',
                    text: msg.text || (msg.type === MessageType.IMAGE ? '[Image]' : msg.type === MessageType.VIDEO ? '[Video]' : ''),
                    type: msg.type || MessageType.TEXT,
                    timestamp: new Date(msg.timestamp).toLocaleString()
                }))
            };
            
            const dataStr = JSON.stringify(chatData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `chat-with-${chat.buyerName || 'Buyer'}-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            
            showNotification('Chat exported successfully', 'success');
        }
    </script>
</body>
