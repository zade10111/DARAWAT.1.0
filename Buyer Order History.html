<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - DARAWAT</title>
    <!-- ============================================================ -->
    <!-- EXTERNAL LIBRARIES                                            -->
    <!-- ============================================================ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ============================================================ -->
    <!-- EXTERNAL CSS FILE - style-order-history.css                  -->
    <!-- ============================================================ -->
    <link rel="stylesheet" href="Buyer Order History.css">
</head>
<body>
    <!-- ============================================================ -->
    <!-- SECTION: HEADER                                               -->
    <!-- ============================================================ -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo"><i class="fas fa-seedling"></i>DARAWAT</div>
                <div class="user-info">
                    <div id="welcomeMessage">Welcome, Buyer!</div>
                    <a href="Register as Buyer.html" class="user-avatar" id="userAvatar">B</a>
                </div>
            </div>
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- SECTION: TOP NAVIGATION                                       -->
    <!-- ============================================================ -->
    <div class="dashboard-nav">
        <div class="container">
            <div class="nav-links">
                <a href="Register as Buyer.html"><i class="fas fa-arrow-left"></i> Back</a>
                <a href="Buyer Profile.html"><i class="fas fa-user"></i> My Profile</a>
                <a href="Buyer Account Setting.html"><i class="fas fa-cog"></i> Account Settings</a>
                <a href="#" class="active"><i class="fas fa-box"></i> Order History</a>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SECTION: MAIN CONTENT                                         -->
    <!-- ============================================================ -->
    <main class="dashboard">
        <div class="container">
            <div class="page-header">
                <div>
                    <h1><i class="fas fa-box"></i> Order History</h1>
                    <p>View and manage your past orders</p>
                </div>
                <button class="btn" onclick="downloadOrderHistory()"><i class="fas fa-download"></i> Download Report</button>
            </div>

            <!-- Success and Error Messages -->
            <div id="successMessage" class="success-message"></div>
            <div id="errorMessage" class="error-message"></div>

            <!-- Filters Section -->
            <div class="filters-section">
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="statusFilter"><i class="fas fa-list"></i> Status</label>
                        <select id="statusFilter">
                            <option value="all">All Statuses</option>
                            <option value="pending"><i class="fas fa-clock"></i> Pending</option>
                            <option value="shipped"><i class="fas fa-truck"></i> Shipped</option>
                            <option value="delivered"><i class="fas fa-check-circle"></i> Delivered</option>
                            <option value="cancelled"><i class="fas fa-times-circle"></i> Cancelled</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="dateFilter"><i class="fas fa-calendar-alt"></i> Date Range</label>
                        <select id="dateFilter">
                            <option value="all">All Time</option>
                            <option value="last7">Last 7 Days</option>
                            <option value="last30">Last 30 Days</option>
                            <option value="last90">Last 3 Months</option>
                            <option value="custom">Custom Range</option>
                        </select>
                    </div>
                    <div class="filter-group" id="customDateRange" style="display: none;">
                        <label for="startDate"><i class="fas fa-calendar-day"></i> From</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="filter-group" id="customDateRangeEnd" style="display: none;">
                        <label for="endDate"><i class="fas fa-calendar-day"></i> To</label>
                        <input type="date" id="endDate">
                    </div>
                    <button class="btn" onclick="applyFilters()"><i class="fas fa-search"></i> Apply Filters</button>
                    <button class="btn btn-outline" onclick="resetFilters()"><i class="fas fa-undo"></i> Reset</button>
                </div>
            </div>

            <!-- Orders Container -->
            <div class="orders-container" id="ordersContainer">
                <!-- Orders will be dynamically inserted here -->
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination">
                <!-- Pagination will be dynamically inserted here -->
            </div>
        </div>
    </main>

    <!-- ============================================================ -->
    <!-- SECTION: ORDER DETAILS MODAL                                  -->
    <!-- ============================================================ -->
    <div class="modal-overlay" id="orderDetailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-clipboard-list"></i> Order Details</h2>
                <button class="close-modal" onclick="closeOrderDetails()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="orderDetailsContent">
                <!-- Order details will be inserted here -->
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SECTION: MOBILE BOTTOM NAVIGATION                             -->
    <!-- ============================================================ -->
    <nav class="mobile-bottom-nav">
        <div class="mobile-nav-items">
            <a href="Register as Buyer.html" class="mobile-nav-item">
                <span class="mobile-nav-icon"><i class="fas fa-arrow-left"></i></span>
                <span class="mobile-nav-label">Back</span>
            </a>
            <a href="Buyer Profile.html" class="mobile-nav-item">
                <span class="mobile-nav-icon"><i class="fas fa-user"></i></span>
                <span class="mobile-nav-label">Profile</span>
            </a>
            <a href="Buyer Account Setting.html" class="mobile-nav-item">
                <span class="mobile-nav-icon"><i class="fas fa-cog"></i></span>
                <span class="mobile-nav-label">Settings</span>
            </a>
            <a href="#" class="mobile-nav-item active">
                <span class="mobile-nav-icon"><i class="fas fa-box"></i></span>
                <span class="mobile-nav-label">Orders</span>
            </a>
        </div>
    </nav>

    <!-- ============================================================ -->
    <!-- SECTION: FOOTER                                               -->
    <!-- ============================================================ -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p><i class="fas fa-copyright"></i> DARAWAT 2026 - Connecting Farmers and Buyers</p>
                <div class="footer-links">
                    <a href="#"><i class="fas fa-shield-alt"></i> Privacy Policy</a>
                    <a href="#"><i class="fas fa-file-contract"></i> Terms of Service</a>
                    <a href="#"><i class="fas fa-envelope"></i> Contact Us</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- ============================================================ -->
    <!-- SECTION: COMPLETE JAVASCRIPT                                  -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // THEME ENGINE - sync with Account Settings
        // ============================================================
        function applyTheme(theme) {
            const body = document.body;
            body.classList.remove('dark-mode');

            if (theme === 'dark') {
                body.classList.add('dark-mode');
            } else if (theme === 'auto') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) body.classList.add('dark-mode');
            }
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('farmNetTheme') || 'light';
            applyTheme(saved);
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'farmNetTheme') {
                loadSavedTheme();
            }
        });

        // ============================================================
        // AUTHENTICATION
        // ============================================================
        function checkAuthentication() {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) {
                alert('Please log in to view your order history.');
                window.location.href = 'Register as Buyer.html';
                return false;
            }
            return true;
        }

        // ============================================================
        // GET CURRENT USER
        // ============================================================
        function getCurrentUser() {
            const currentUser = localStorage.getItem('currentUser');
            return currentUser ? JSON.parse(currentUser) : null;
        }

        // ============================================================
        // LOAD USER DATA
        // ============================================================
        function loadUserData() {
            const currentUser = getCurrentUser();
            if (currentUser) {
                document.getElementById('welcomeMessage').textContent = `Welcome, ${currentUser.name}!`;
                
                const buyerAvatar = localStorage.getItem(`buyerAvatar_${currentUser.email}`);
                const userAvatar = document.getElementById('userAvatar');
                
                if (buyerAvatar) {
                    userAvatar.innerHTML = `<img src="${buyerAvatar}" alt="Buyer Avatar">`;
                } else if (currentUser.profilePicture) {
                    userAvatar.innerHTML = `<img src="${currentUser.profilePicture}" alt="Profile Picture">`;
                } else {
                    userAvatar.textContent = currentUser.name.charAt(0).toUpperCase();
                }
            }
        }

        // ============================================================
        // GET ORDERS
        // ============================================================
        function getOrders() {
            const currentUser = getCurrentUser();
            if (!currentUser) return [];
            
            let orders = [];
            
            const farmConnectOrders = JSON.parse(localStorage.getItem('farmConnectOrders') || '[]');
            if (farmConnectOrders.length > 0) {
                orders = farmConnectOrders.filter(order => order.buyerEmail === currentUser.email);
            }
            
            if (orders.length === 0) {
                const buyerOrders = JSON.parse(localStorage.getItem(`buyerOrders_${currentUser.email}`) || '[]');
                if (buyerOrders.length > 0) {
                    orders = buyerOrders;
                }
            }
            
            if (orders.length === 0) {
                const cartItems = JSON.parse(localStorage.getItem('farmConnectCartItems') || '[]');
                if (cartItems.length > 0) {
                    const completedCartItems = cartItems.filter(item => item.orderStatus);
                    if (completedCartItems.length > 0) {
                        orders = completedCartItems.map(item => ({
                            id: item.orderId || `ORD-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                            buyerEmail: currentUser.email,
                            buyerName: currentUser.name,
                            date: item.orderDate || new Date().toISOString(),
                            status: item.orderStatus || 'pending',
                            products: [{
                                productId: item.productId,
                                productName: item.productName,
                                sellerEmail: item.sellerEmail,
                                sellerName: item.sellerName,
                                price: item.price,
                                quantity: item.quantity
                            }],
                            subtotal: item.price,
                            shipping: '₱50',
                            total: `₱${(parseFloat(item.price.replace(/[^\d.]/g, '')) + 50).toFixed(2)}`,
                            shippingAddress: currentUser.address || 'Address not specified',
                            paymentMethod: 'Credit Card',
                            orderTimeline: [
                                { date: item.orderDate || new Date().toISOString(), status: 'Order Placed' }
                            ]
                        }));
                        
                        localStorage.setItem(`buyerOrders_${currentUser.email}`, JSON.stringify(orders));
                    }
                }
            }
            
            return orders;
        }

        // ============================================================
        // DISPLAY ORDERS
        // ============================================================
        function displayOrders(orders) {
            const ordersContainer = document.getElementById('ordersContainer');
            
            if (orders.length === 0) {
                ordersContainer.innerHTML = `
                    <div class="no-orders">
                        <p><i class="fas fa-inbox"></i> No orders found.</p>
                        <p>Your order history will appear here once you place orders.</p>
                        <a href="Register as Buyer.html" class="btn"><i class="fas fa-shopping-bag"></i> Start Shopping</a>
                    </div>
                `;
                return;
            }
            
            ordersContainer.innerHTML = '';
            
            orders.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            orders.forEach(order => {
                const orderItem = document.createElement('div');
                orderItem.className = 'order-item';
                
                const orderDate = new Date(order.date);
                const formattedDate = orderDate.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
                
                let productsHTML = '';
                if (order.products && order.products.length > 0) {
                    order.products.forEach(product => {
                        productsHTML += `
                            <div class="product-item">
                                <div class="product-image"><i class="fas fa-shopping-bag"></i></div>
                                <div class="product-info">
                                    <div class="product-name"><i class="fas fa-leaf"></i> ${product.productName || product.name}</div>
                                    <div class="product-meta">
                                        <span><i class="fas fa-money-bill-wave"></i> Price: ${product.price}</span>
                                        <span><i class="fas fa-weight-hanging"></i> Quantity: ${product.quantity}</span>
                                        <span><i class="fas fa-tractor"></i> Farmer: ${product.sellerName || 'Local Farmer'}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    productsHTML = `
                        <div class="product-item">
                            <div class="product-image"><i class="fas fa-shopping-bag"></i></div>
                            <div class="product-info">
                                <div class="product-name"><i class="fas fa-leaf"></i> ${order.productName || 'Product'}</div>
                                <div class="product-meta">
                                    <span><i class="fas fa-money-bill-wave"></i> Price: ${order.price}</span>
                                    <span><i class="fas fa-weight-hanging"></i> Quantity: ${order.quantity || 1}</span>
                                    <span><i class="fas fa-tractor"></i> Farmer: ${order.sellerName || 'Local Farmer'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                let statusIcon = '';
                let statusText = '';
                switch(order.status) {
                    case 'delivered': statusIcon = '<i class="fas fa-check-circle"></i>'; statusText = 'Delivered'; break;
                    case 'pending': statusIcon = '<i class="fas fa-clock"></i>'; statusText = 'Pending'; break;
                    case 'shipped': statusIcon = '<i class="fas fa-truck"></i>'; statusText = 'Shipped'; break;
                    case 'cancelled': statusIcon = '<i class="fas fa-times-circle"></i>'; statusText = 'Cancelled'; break;
                    default: statusIcon = '<i class="fas fa-clock"></i>'; statusText = 'Pending';
                }
                
                const subtotal = order.subtotal || order.total || '₱0';
                const shipping = order.shipping || '₱50';
                const total = order.total || subtotal;
                
                orderItem.innerHTML = `
                    <div class="order-header">
                        <div>
                            <div class="order-id"><i class="fas fa-hashtag"></i> Order #${order.id}</div>
                            <div class="order-date"><i class="fas fa-calendar-alt"></i> Placed on: ${formattedDate}</div>
                        </div>
                        <div class="order-status status-${order.status || 'pending'}">${statusIcon} ${statusText}</div>
                    </div>
                    <div class="order-details">
                        <div class="order-products">
                            ${productsHTML}
                        </div>
                        <div class="order-summary">
                            <div class="summary-row">
                                <span><i class="fas fa-money-bill-wave"></i> Subtotal:</span>
                                <span>${subtotal}</span>
                            </div>
                            <div class="summary-row">
                                <span><i class="fas fa-truck"></i> Shipping:</span>
                                <span>${shipping}</span>
                            </div>
                            <div class="summary-row total">
                                <span><i class="fas fa-receipt"></i> Total:</span>
                                <span>${total}</span>
                            </div>
                        </div>
                    </div>
                    <div class="order-actions">
                        <button class="btn btn-outline" onclick="viewOrderDetails('${order.id}')"><i class="fas fa-eye"></i> View Details</button>
                        ${(order.status === 'delivered') ? '<button class="btn btn-outline" onclick="reorderItems(\'' + order.id + '\')"><i class="fas fa-redo"></i> Reorder</button>' : ''}
                        ${(order.status === 'pending') ? '<button class="btn btn-outline" onclick="cancelOrder(\'' + order.id + '\')"><i class="fas fa-times"></i> Cancel Order</button>' : ''}
                    </div>
                `;
                
                ordersContainer.appendChild(orderItem);
            });
        }

        // ============================================================
        // LOAD ORDERS
        // ============================================================
        function loadOrders() {
            const orders = getOrders();
            displayOrders(orders);
        }

        // ============================================================
        // APPLY FILTERS
        // ============================================================
        function applyFilters() {
            const statusFilter = document.getElementById('statusFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            let filteredOrders = getOrders();
            
            if (statusFilter !== 'all') {
                filteredOrders = filteredOrders.filter(order => order.status === statusFilter);
            }
            
            if (dateFilter !== 'all') {
                const now = new Date();
                let startDateObj;
                
                switch(dateFilter) {
                    case 'last7':
                        startDateObj = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                        break;
                    case 'last30':
                        startDateObj = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                        break;
                    case 'last90':
                        startDateObj = new Date(now.getTime() - 90 * 24 * 60 * 60 * 1000);
                        break;
                    case 'custom':
                        if (startDate && endDate) {
                            startDateObj = new Date(startDate);
                            const endDateObj = new Date(endDate);
                            filteredOrders = filteredOrders.filter(order => {
                                const orderDate = new Date(order.date);
                                return orderDate >= startDateObj && orderDate <= endDateObj;
                            });
                        }
                        break;
                }
                
                if (dateFilter !== 'custom') {
                    filteredOrders = filteredOrders.filter(order => {
                        const orderDate = new Date(order.date);
                        return orderDate >= startDateObj;
                    });
                }
            }
            
            displayOrders(filteredOrders);
        }

        // ============================================================
        // RESET FILTERS
        // ============================================================
        function resetFilters() {
            document.getElementById('statusFilter').value = 'all';
            document.getElementById('dateFilter').value = 'all';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('customDateRange').style.display = 'none';
            document.getElementById('customDateRangeEnd').style.display = 'none';
            
            loadOrders();
        }

        // ============================================================
        // VIEW ORDER DETAILS
        // ============================================================
        function viewOrderDetails(orderId) {
            const orders = getOrders();
            const order = orders.find(o => o.id == orderId);
            
            if (order) {
                const modal = document.getElementById('orderDetailsModal');
                const content = document.getElementById('orderDetailsContent');
                
                const orderDate = new Date(order.date);
                const formattedDate = orderDate.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
                
                let productsHTML = '';
                if (order.products && order.products.length > 0) {
                    order.products.forEach(product => {
                        productsHTML += `
                            <div class="product-details">
                                <div class="product-detail-header">
                                    <div class="product-detail-name"><i class="fas fa-leaf"></i> ${product.productName || product.name}</div>
                                    <div class="product-detail-price">${product.price}</div>
                                </div>
                                <div class="product-detail-meta">
                                    <span><i class="fas fa-weight-hanging"></i> Quantity: ${product.quantity}</span>
                                    <span><i class="fas fa-tractor"></i> Farmer: ${product.sellerName || 'Local Farmer'}</span>
                                </div>
                            </div>
                        `;
                    });
                }
                
                let timelineHTML = '';
                if (order.orderTimeline && order.orderTimeline.length > 0) {
                    order.orderTimeline.forEach((item, index) => {
                        const isActive = index === order.orderTimeline.length - 1;
                        const isCompleted = index < order.orderTimeline.length - 1;
                        
                        const itemClass = isActive ? 'active' : (isCompleted ? 'completed' : '');
                        const date = new Date(item.date);
                        const formattedTimelineDate = date.toLocaleDateString('en-US', { 
                            year: 'numeric', 
                            month: 'short', 
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        
                        timelineHTML += `
                            <div class="timeline-item ${itemClass}">
                                <div class="timeline-date">${formattedTimelineDate}</div>
                                <div class="timeline-status">${item.status}</div>
                            </div>
                        `;
                    });
                } else {
                    const orderDateObj = new Date(order.date);
                    timelineHTML = `
                        <div class="timeline-item completed">
                            <div class="timeline-date">${orderDateObj.toLocaleDateString('en-US', { 
                                year: 'numeric', 
                                month: 'short', 
                                day: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            })}</div>
                            <div class="timeline-status">Order Placed</div>
                        </div>
                    `;
                    
                    if (order.status === 'shipped' || order.status === 'delivered') {
                        const shippedDate = new Date(orderDateObj.getTime() + 24 * 60 * 60 * 1000);
                        timelineHTML += `
                            <div class="timeline-item ${order.status === 'shipped' ? 'active' : 'completed'}">
                                <div class="timeline-date">${shippedDate.toLocaleDateString('en-US', { 
                                    year: 'numeric', 
                                    month: 'short', 
                                    day: 'numeric',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                })}</div>
                                <div class="timeline-status">Shipped</div>
                            </div>
                        `;
                    }
                    
                    if (order.status === 'delivered') {
                        const deliveredDate = new Date(orderDateObj.getTime() + 48 * 60 * 60 * 1000);
                        timelineHTML += `
                            <div class="timeline-item active">
                                <div class="timeline-date">${deliveredDate.toLocaleDateString('en-US', { 
                                    year: 'numeric', 
                                    month: 'short', 
                                    day: 'numeric',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                })}</div>
                                <div class="timeline-status">Delivered</div>
                            </div>
                        `;
                    }
                }
                
                content.innerHTML = `
                    <div class="order-detail-section">
                        <h3><i class="fas fa-clipboard-list"></i> Order Information</h3>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-hashtag"></i> Order ID</div>
                                <div class="detail-value">${order.id}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-calendar-alt"></i> Order Date</div>
                                <div class="detail-value">${formattedDate}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-info-circle"></i> Order Status</div>
                                <div class="detail-value">${order.status.charAt(0).toUpperCase() + order.status.slice(1)}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-credit-card"></i> Payment Method</div>
                                <div class="detail-value">${order.paymentMethod || 'Not specified'}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="order-detail-section">
                        <h3><i class="fas fa-shopping-bag"></i> Products</h3>
                        ${productsHTML}
                    </div>
                    
                    <div class="order-detail-section">
                        <h3><i class="fas fa-receipt"></i> Order Summary</h3>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-money-bill-wave"></i> Subtotal</div>
                                <div class="detail-value">${order.subtotal || '₱0'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-truck"></i> Shipping</div>
                                <div class="detail-value">${order.shipping || '₱50'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-receipt"></i> Total</div>
                                <div class="detail-value">${order.total || '₱0'}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="order-detail-section">
                        <h3><i class="fas fa-map-marker-alt"></i> Shipping Information</h3>
                        <div class="detail-item">
                            <div class="detail-label"><i class="fas fa-address-card"></i> Shipping Address</div>
                            <div class="detail-value">${order.shippingAddress || 'Not specified'}</div>
                        </div>
                        ${order.trackingNumber ? `
                        <div class="detail-item">
                            <div class="detail-label"><i class="fas fa-box"></i> Tracking Number</div>
                            <div class="detail-value">${order.trackingNumber}</div>
                        </div>
                        ` : ''}
                    </div>
                    
                    <div class="order-detail-section">
                        <h3><i class="fas fa-chart-line"></i> Order Timeline</h3>
                        <div class="timeline">
                            ${timelineHTML}
                        </div>
                    </div>
                `;
                
                modal.style.display = 'flex';
            }
        }

        // ============================================================
        // CLOSE ORDER DETAILS
        // ============================================================
        function closeOrderDetails() {
            const modal = document.getElementById('orderDetailsModal');
            modal.style.display = 'none';
        }

        // ============================================================
        // REORDER ITEMS
        // ============================================================
        function reorderItems(orderId) {
            const orders = getOrders();
            const order = orders.find(o => o.id == orderId);
            if (order) {
                if (confirm(`Add all items from order ${orderId} to your cart?`)) {
                    const cartItems = JSON.parse(localStorage.getItem('farmConnectCartItems') || '[]');
                    const currentUser = getCurrentUser();
                    
                    if (order.products && order.products.length > 0) {
                        order.products.forEach(product => {
                            const cartItem = {
                                id: Date.now(),
                                productId: product.productId || product.id,
                                productName: product.productName || product.name,
                                buyerEmail: currentUser.email,
                                buyerName: currentUser.name,
                                sellerEmail: product.sellerEmail,
                                sellerName: product.sellerName,
                                price: product.price,
                                quantity: product.quantity || 1,
                                date: new Date().toISOString()
                            };
                            cartItems.push(cartItem);
                        });
                    } else {
                        const cartItem = {
                            id: Date.now(),
                            productId: order.productId,
                            productName: order.productName,
                            buyerEmail: currentUser.email,
                            buyerName: currentUser.name,
                            sellerEmail: order.sellerEmail,
                            sellerName: order.sellerName,
                            price: order.price,
                            quantity: order.quantity || 1,
                            date: new Date().toISOString()
                        };
                        cartItems.push(cartItem);
                    }
                    
                    localStorage.setItem('farmConnectCartItems', JSON.stringify(cartItems));
                    showMessage('Items added to cart!', 'success');
                    
                    window.dispatchEvent(new Event('storage'));
                }
            }
        }

        // ============================================================
        // CANCEL ORDER
        // ============================================================
        function cancelOrder(orderId) {
            if (confirm(`Are you sure you want to cancel order ${orderId}?`)) {
                const orders = JSON.parse(localStorage.getItem('farmConnectOrders') || '[]');
                const orderIndex = orders.findIndex(o => o.id == orderId);
                
                if (orderIndex !== -1) {
                    orders[orderIndex].status = 'cancelled';
                    localStorage.setItem('farmConnectOrders', JSON.stringify(orders));
                    showMessage(`Order ${orderId} has been cancelled.`, 'success');
                    
                    setTimeout(() => {
                        loadOrders();
                    }, 500);
                    
                    window.dispatchEvent(new Event('storage'));
                } else {
                    const currentUser = getCurrentUser();
                    const buyerOrders = JSON.parse(localStorage.getItem(`buyerOrders_${currentUser.email}`) || '[]');
                    const buyerOrderIndex = buyerOrders.findIndex(o => o.id == orderId);
                    
                    if (buyerOrderIndex !== -1) {
                        buyerOrders[buyerOrderIndex].status = 'cancelled';
                        localStorage.setItem(`buyerOrders_${currentUser.email}`, JSON.stringify(buyerOrders));
                        showMessage(`Order ${orderId} has been cancelled.`, 'success');
                        
                        setTimeout(() => {
                            loadOrders();
                        }, 500);
                    } else {
                        showMessage('Order not found.', 'error');
                    }
                }
            }
        }

        // ============================================================
        // DOWNLOAD ORDER HISTORY
        // ============================================================
        function downloadOrderHistory() {
            const orders = getOrders();
            if (orders.length === 0) {
                showMessage('No orders to download.', 'error');
                return;
            }
            
            let csvContent = "Order ID,Date,Status,Product,Quantity,Price,Total\n";
            orders.forEach(order => {
                const date = new Date(order.date).toLocaleDateString();
                if (order.products && order.products.length > 0) {
                    order.products.forEach(product => {
                        csvContent += `"${order.id}","${date}","${order.status}","${product.productName || product.name}","${product.quantity}","${product.price}","${order.total}"\n`;
                    });
                } else {
                    csvContent += `"${order.id}","${date}","${order.status}","${order.productName}","${order.quantity}","${order.price}","${order.total}"\n`;
                }
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', 'order-history.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            showMessage('Order history downloaded successfully!', 'success');
        }

        // ============================================================
        // SHOW MESSAGES
        // ============================================================
        function showMessage(message, type) {
            const messageElement = document.getElementById(type === 'success' ? 'successMessage' : 'errorMessage');
            messageElement.textContent = message;
            messageElement.style.display = 'block';
            
            setTimeout(() => {
                messageElement.style.display = 'none';
            }, 5000);
        }

        // ============================================================
        // SETUP EVENT LISTENERS
        // ============================================================
        function setupEventListeners() {
            document.getElementById('dateFilter').addEventListener('change', function() {
                const customDateRange = document.getElementById('customDateRange');
                const customDateRangeEnd = document.getElementById('customDateRangeEnd');
                
                if (this.value === 'custom') {
                    customDateRange.style.display = 'block';
                    customDateRangeEnd.style.display = 'block';
                } else {
                    customDateRange.style.display = 'none';
                    customDateRangeEnd.style.display = 'none';
                }
            });

            // Click outside modal to close
            document.getElementById('orderDetailsModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeOrderDetails();
                }
            });
        }

        // ============================================================
        // SETUP MOBILE NAVIGATION
        // ============================================================
        function setupMobileNavigation() {
            const mobileNavItems = document.querySelectorAll('.mobile-nav-item');
            
            mobileNavItems.forEach(item => {
                item.addEventListener('click', function() {
                    mobileNavItems.forEach(navItem => {
                        navItem.classList.remove('active');
                    });
                    this.classList.add('active');
                });
            });
        }

        // ============================================================
        // SETUP AVATAR SYNC
        // ============================================================
        function setupAvatarSync() {
            window.addEventListener('storage', function(e) {
                if (e.key === 'currentUser' || e.key?.startsWith('buyerAvatar_')) {
                    loadUserData();
                }
            });
        }

        // ============================================================
        // SETUP REAL-TIME UPDATES
        // ============================================================
        function setupRealTimeUpdates() {
            window.addEventListener('storage', function(e) {
                switch(e.key) {
                    case 'farmConnectOrders':
                        loadOrders();
                        break;
                    case 'currentUser':
                        loadUserData();
                        break;
                    case `buyerAvatar_${getCurrentUser()?.email}`:
                        loadUserData();
                        break;
                    case 'farmNetTheme':
                        loadSavedTheme();
                        break;
                }
            });

            const originalSetItem = localStorage.setItem;
            localStorage.setItem = function(key, value) {
                const event = new Event('localStorageChanged');
                event.key = key;
                event.value = value;
                window.dispatchEvent(event);
                originalSetItem.apply(this, arguments);
            };

            window.addEventListener('localStorageChanged', function(e) {
                if (e.key === 'farmConnectOrders') {
                    loadOrders();
                }
                if (e.key === 'farmNetTheme') {
                    loadSavedTheme();
                }
            });
        }

        // ============================================================
        // AUTO THEME LISTENER
        // ============================================================
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
            if (localStorage.getItem('farmNetTheme') === 'auto') {
                applyTheme('auto');
            }
        });

        // ============================================================
        // INITIALIZATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuthentication()) return;
            
            loadSavedTheme();
            loadUserData();
            loadOrders();
            setupEventListeners();
            setupMobileNavigation();
            setupAvatarSync();
            setupRealTimeUpdates();
        });
    </script>
</body>
</html>
